version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # FastAPI Web Server & React SPA Frontend
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriwatch_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # LiveKit Voice Worker (WebRTC Voice Streaming, Gnani STT/TTS & Silero VAD)
  # ----------------------------------------------------------------------------
  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriwatch_voice_worker
    command: ["python", "voice_engine/livekit_worker.py", "start"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - web

